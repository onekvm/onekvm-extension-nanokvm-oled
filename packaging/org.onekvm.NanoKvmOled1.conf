<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="onekvm-extension">
    <allow own="org.onekvm.NanoKvmOled1"/>
  </policy>
  <policy context="default">
    <deny own="org.onekvm.NanoKvmOled1"/>
    <allow send_destination="org.onekvm.NanoKvmOled1"/>
  </policy>
</busconfig>
